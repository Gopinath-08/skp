<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Ideal Computer Education</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <style>
        .page-header {
            padding: 150px 0 80px;
            text-align: center;
            background: linear-gradient(135deg, rgba(30,58,138,0.9), rgba(59,130,246,0.8)), url('/images/gallery3.jpg') center/cover;
            color: white;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 60px 0;
        }
        .gallery-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 4/3;
            cursor: pointer;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .gallery-overlay {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(30,58,138,0.9));
            padding: 20px;
            color: white;
            transition: bottom 0.3s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        .gallery-item:hover .gallery-overlay {
            bottom: 0;
        }
    </style>
</head>
<body>
    <nav class="navbar scrolled">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="/images/logo.png" alt="Logo" class="logo-img">
                <span class="logo-text">IDEAL COMPUTER EDUCATION</span>
            </div>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <a href="/about" class="nav-link">About</a>
                <a href="/courses" class="nav-link">Courses</a>
                <a href="/gallery" class="nav-link active">Gallery</a>
                <a href="/admission" class="nav-link">Admission</a>
                <a href="/contact" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1 data-aos="fade-down">Photo Gallery</h1>
            <p data-aos="fade-up">Glimpses of life at Ideal Computer Education</p>
        </div>
    </header>

    <main class="container">
        <div class="gallery-grid" id="gallery-grid">
            <!-- Gallery injected dynamically -->
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });
        
        async function loadGallery() {
            try {
                const res = await fetch('/api/gallery');
                const gallery = await res.json();
                const grid = document.getElementById('gallery-grid');
                if(gallery.length === 0) {
                    grid.innerHTML = '<p>No images in gallery yet.</p>';
                    return;
                }
                grid.innerHTML = gallery.map((item, i) => `
                    <div class="gallery-item" data-aos="zoom-in" data-aos-delay="${(i%4)*100}">
                        <img src="${item.imageUrl}" alt="${item.title}">
                        <div class="gallery-overlay">
                            <h4>${item.title}</h4>
                            <small>${item.category || 'General'}</small>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }
        loadGallery();
    </script>
</body>
</html>
