<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - Ideal Computer Education</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <style>
        .page-header {
            padding: 150px 0 80px;
            text-align: center;
            background: linear-gradient(135deg, rgba(30,58,138,0.9), rgba(59,130,246,0.8)), url('/images/gallery1.jpg') center/cover;
            color: white;
        }
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            padding: 60px 0;
        }
        .course-card {
            background: var(--bg-card, #fff);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            position: relative;
        }
        .course-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(30,58,138,0.2);
        }
        .course-image {
            height: 200px;
            background: linear-gradient(45deg, #1e3a8a, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 4rem;
        }
        .course-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .course-content {
            padding: 25px;
        }
        .course-title {
            font-size: 1.25rem;
            color: var(--primary-color, #1e3a8a);
            margin-bottom: 15px;
            font-weight: 600;
        }
        .course-details {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }
        .course-details i {
            margin-right: 5px;
            color: #3b82f6;
        }
        .course-description {
            color: #475569;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .course-cta .btn {
            width: 100%;
            text-align: center;
        }
        
        body.dark-mode .course-card { background: #1e1e2d; }
        body.dark-mode .course-title { color: #fff; }
        body.dark-mode .course-description { color: #aaa; }
    </style>
</head>
<body>
    <nav class="navbar scrolled">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="/images/logo.png" alt="Logo" class="logo-img">
                <span class="logo-text">IDEAL COMPUTER EDUCATION</span>
            </div>
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <a href="/about" class="nav-link">About</a>
                <a href="/courses" class="nav-link active">Courses</a>
                <a href="/gallery" class="nav-link">Gallery</a>
                <a href="/admission" class="nav-link">Admission</a>
                <a href="/contact" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1 data-aos="fade-down">Our Courses</h1>
            <p data-aos="fade-up">Job-Oriented Computer Training Programs</p>
        </div>
    </header>

    <main class="container">
        <div class="courses-grid" id="courses-grid">
            <!-- Courses loaded dynamically -->
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });
        
        async function loadCourses() {
            try {
                const res = await fetch('/api/courses');
                const courses = await res.json();
                const grid = document.getElementById('courses-grid');
                if(courses.length === 0) {
                    grid.innerHTML = '<p>No courses currently available.</p>';
                    return;
                }
                grid.innerHTML = courses.map((course, index) => `
                    <div class="course-card" data-aos="fade-up" data-aos-delay="${index * 100}">
                        <div class="course-image">
                            ${course.imageUrl ? `<img src="${course.imageUrl}" alt="${course.name}">` : `<i class="fas fa-laptop-code"></i>`}
                        </div>
                        <div class="course-content">
                            <h3 class="course-title">${course.name}</h3>
                            <p class="course-description">${course.description || 'Comprehensive training program designed for industry readiness.'}</p>
                            <div class="course-details">
                                <div><i class="fas fa-clock"></i> ${course.duration}</div>
                                <div><i class="fas fa-rupee-sign"></i> ${course.fees}</div>
                            </div>
                            <div class="course-cta">
                                <a href="/admission?course=${course._id}" class="btn btn-primary">Enroll Now</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }
        loadCourses();
    </script>
</body>
</html>
